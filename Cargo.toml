[package]
name = "nsh-app-tinycast"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.0"
nsh-base = "0.6.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
objc2 = "0.6.5"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg", "net", "sound"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg"] }
dispatch2 = "0.3.1"
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg", "net"] }

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = ["block2", "NSPasteboard", "NSRunningApplication", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
features = ["NSString", "NSArray", "NSError", "NSFileManager", "NSURL", "NSData", "NSDictionary", "NSGeometry"]
